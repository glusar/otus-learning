---
- name: OSPF
  hosts: all
  become: true
  vars_files:
    - default/main.yml
  tasks:
    - name: Install base tools
      ansible.builtin.apt:
        name:
          - vim
          - traceroute
          - tcpdump
          - net-tools
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Stop and disable UFW firewall
      community.general.ufw:
        state: disabled

    - name: Stop and disable UFW systemd service
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false

    - name: Set up forward packages across routers
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.forwarding
        value: '1'
        state: present

    - name: Set up asynchronous routing
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: '0'
        state: present

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download FRR GPG key
      ansible.builtin.get_url:
        url: https://deb.frrouting.org/frr/keys.asc
        dest: /etc/apt/keyrings/frr.asc
        owner: root
        group: root
        mode: '0644'

    - name: Add FRR repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/frr.asc]
          https://deb.frrouting.org/frr
          {{ ansible_facts.distribution_release }}
          frr-stable
        filename: frr
        state: present
        update_cache: true

    - name: Install FRR and FRR Python tools
      ansible.builtin.apt:
        name:
          - frr
          - frr-pythontools
        state: present
        update_cache: true

    - name: Enable osfpd and zebra
      ansible.builtin.template:
        src: "templates/frr_daemons"
        dest: /etc/frr/daemons
        owner: frr
        group: frr
        mode: "0640"

    - name: Configure frr
      ansible.builtin.template:
        src: "templates/frr_conf.j2"
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: "0640"

    - name: Enable and start FRR
      ansible.builtin.systemd:
        name: frr
        enabled: true
        state: restarted
