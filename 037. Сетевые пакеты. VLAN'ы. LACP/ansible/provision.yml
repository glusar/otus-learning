- name: Base set up
# Настройка производится на всех хостах
  hosts: all
  become: true
  tasks:
# Установка приложений на RedHat-based системах
    - name: Install software on CentOS
      ansible.builtin.dnf:
        name:
          - vim
          - traceroute
          - tcpdump
          - net-tools
        state: present
        update_cache: true
      when: (ansible_os_family == "RedHat")

# Установка приложений на Debian-based системах
    - name: Install software on Debian-based
      ansible.builtin.apt:
        name:
          - vim
          - traceroute
          - tcpdump
          - net-tools
        state: present
        update_cache: true
      when: (ansible_os_family == "Debian")

- name: Set up vlan1
# Настройка будет производится на хостах testClient1 и testServer1
  hosts: testClient1,testServer1
# Настройка производится от root-пользователя
  become: true
  tasks:
    # Добавление темплейта в файл /etc/sysconfig/network-scripts/ifcfg-vlan1
    - name: Set up vlan1
      ansible.builtin.template:
        src: ifcfg-vlan1.j2
        dest: /etc/sysconfig/network-scripts/ifcfg-vlan1
        owner: root
        group: root
        mode: "0644"
    # Перезапуск службы NetworkManager
    - name: Restart network for vlan1
      ansible.builtin.service:
        name: NetworkManager
        state: restarted

- name: Set up vlan2
  hosts: testClient2,testServer2
  become: true
  tasks:
    - name: Set up vlan2
      ansible.builtin.template:
        src: 50-cloud-init.yaml.j2
        dest: /etc/netplan/50-cloud-init.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Apply set up vlan2
      ansible.builtin.command: netplan apply
      become: true
      changed_when: true

- name: Set up bond0
  hosts: inetRouter,centralRouter
  become: true
  tasks:
    - name: Set up ifcfg-bond0
      ansible.builtin.template:
        src: ifcfg-bond0.j2
        dest: /etc/sysconfig/network-scripts/ifcfg-bond0
        owner: root
        group: root
        mode: "0644"

    - name: Set up eth1,eth2
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/sysconfig/network-scripts/
        owner: root
        group: root
        mode: "0644"
      with_items:
        - ifcfg-eth1
        - ifcfg-eth2
    # Перезагрузка хостов
    - name: Restart hosts for bond0
      ansible.builtin.reboot:
        reboot_timeout: 3600
