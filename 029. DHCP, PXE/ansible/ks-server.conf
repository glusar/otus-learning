<VirtualHost 10.0.0.20:80>
    DocumentRoot /var/www/html

    Alias /images/ /srv/images/
    <Directory /srv/images/>
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /ks/ /srv/ks/
    <Directory /srv/ks/>
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
