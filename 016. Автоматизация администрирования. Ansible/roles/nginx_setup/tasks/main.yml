---

- name: Nginx install
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Copy site files
  ansible.builtin.copy:
    src: files/index.html
    dest: /var/www/html
    mode: '0644'

- name: Copy config
  ansible.builtin.template:
    src: templates/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: Restart Nginx

# tasks file for nginx_setup
