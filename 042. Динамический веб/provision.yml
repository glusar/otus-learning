---
- name: Install Docker and deploy application
  hosts: DynamicWeb
  become: true
  gather_facts: true

  tasks:

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create Docker keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          noble stable
        state: present
        filename: docker
        update_cache: true

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add vagrant user to docker group
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Copy project
      copy:
        src: project
        dest: /home/vagrant/
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Reset SSH connection
      meta: reset_connection

    - name: Run Docker Compose
      become_user: vagrant
      command:
        cmd: docker compose up -d
        chdir: /home/vagrant/project