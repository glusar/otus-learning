---
- name: VPN
  hosts: all
  become: true
  tasks:
    - name: Init PKI
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa init-pki
        chdir: /etc/openvpn
        creates: /etc/openvpn/pki

    - name: Build CA
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa build-ca nopass
        chdir: /etc/openvpn
      environment:
        EASYRSA_BATCH: "1"
        EASYRSA_REQ_CN: rasvpn-ca
      args:
        creates: /etc/openvpn/pki/ca.crt

    - name: Generate server key and request
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa gen-req server nopass
        chdir: /etc/openvpn
      environment:
        EASYRSA_BATCH: "1"
        EASYRSA_REQ_CN: rasvpn
      args:
        creates: /etc/openvpn/pki/private/server.key

    - name: Generate server certificate
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa --batch sign-req server server
        chdir: /etc/openvpn
      args:
        creates: /etc/openvpn/pki/issued/server.crt

    - name: Generate DH parameters
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa gen-dh
        chdir: /etc/openvpn
      args:
        creates: /etc/openvpn/pki/dh.pem

    - name: Generate client key and request
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa gen-req client nopass
        chdir: /etc/openvpn
      environment:
        EASYRSA_BATCH: "1"
        EASYRSA_REQ_CN: client
      args:
        creates: /etc/openvpn/pki/private/client.key

    - name: Generate client certificate
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa --batch sign-req client client
        chdir: /etc/openvpn
      args:
        creates: /etc/openvpn/pki/issued/client.crt

    - name: Copy server conf
      ansible.builtin.copy:
        src: files/server.conf
        dest: /etc/openvpn/server.conf
        owner: root
        group: root
        mode: "0600"

    - name: Copy client conf
      ansible.builtin.copy:
        src: files/client
        dest: /etc/openvpn/client/client
        owner: root
        group: root
        mode: "0600"

    - name: Copy systemd unit
      ansible.builtin.copy:
        src: files/openvpn.service
        dest: /etc/systemd/system/openvpn@.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start Openvpn
      ansible.builtin.systemd:
        name: openvpn@server
        enabled: true
        state: restarted

    - name: Fetch ca.crt
      ansible.builtin.fetch:
        src: /etc/openvpn/pki/ca.crt
        dest: ../
        flat: true

    - name: Fetch client.crt
      ansible.builtin.fetch:
        src: /etc/openvpn/pki/issued/client.crt
        dest: ../
        flat: true

    - name: Fetch client key
      ansible.builtin.fetch:
        src: /etc/openvpn/pki/private/client.key
        dest: ../
        flat: true

    - name: Copy client conf
      ansible.builtin.copy:
        src: files/client.conf
        dest: ../
        remote_src: true
      delegate_to: localhost
      run_once: true
      become: false
