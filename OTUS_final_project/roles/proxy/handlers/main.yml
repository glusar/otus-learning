---
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Reload Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart Node Exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
