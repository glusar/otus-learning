---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Save validated firewall rules
  ansible.builtin.template:
    src: proxy.nft.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Start nftables and enable it at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Apply firewall changes before enabling forwarding
  ansible.builtin.meta: flush_handlers

- name: Save IPv4 forwarding configuration
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-otus-proxy-forwarding.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: '0644'

- name: Read the current IPv4 forwarding setting
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: proxy_ip_forward
  changed_when: false
  check_mode: false

- name: Enable IPv4 forwarding
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
  when: proxy_ip_forward.stdout != '1'
  changed_when: true
