---
- name: Restart Corosync
  ansible.builtin.systemd_service:
    name: corosync
    state: restarted

- name: Restart QDevice
  ansible.builtin.systemd_service:
    name: corosync-qdevice
    state: restarted

- name: Restart PHP-FPM
  ansible.builtin.systemd_service:
    name: php8.3-fpm
    state: restarted

- name: Restart Apache
  ansible.builtin.systemd_service:
    name: apache2
    state: restarted

- name: Restart Node Exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted

- name: Reload Nextcloud PHP configuration
  ansible.builtin.systemd_service:
    name: php8.3-fpm
    state: reloaded
